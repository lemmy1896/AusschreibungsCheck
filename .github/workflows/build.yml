name: Windows-Programm bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: .exe bauen
        run: pyinstaller --onefile --windowed --name AusschreibungsCheck --add-data "profil_ifs.yaml;." gui.py

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paket | Out-Null
          Copy-Item dist/AusschreibungsCheck.exe paket/
          Copy-Item ANLEITUNG.md paket/
          Compress-Archive -Path paket/* -DestinationPath AusschreibungsCheck.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AusschreibungsCheck
          path: paket/

      - name: Download auf der Release-Seite veröffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version-${{ github.run_number }}
          name: AusschreibungsCheck Version ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Herunterladen: AusschreibungsCheck.zip unten bei Assets, entpacken, AusschreibungsCheck.exe doppelklicken."
          files: AusschreibungsCheck.zip
