name: Live-Datenprüfung

on:
  push:
    branches: [main]
    paths: ["ausschreibungscheck.py", "werkzeuge/**", "profil_*.yaml", ".github/workflows/datenpruefung.yml"]
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python werkzeuge/datenpruefung.py
      - name: Echter Suchlauf über 14 Tage, alle Profil-Plattformen
        run: |
          python ausschreibungscheck.py --von "$(date -d '14 days ago' +%F)" --nicht-oeffnen
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from openpyxl import load_workbook
          excel = sorted(Path("ergebnisse").glob("*.xlsx"))[-1]
          zeilen = list(load_workbook(excel)["Treffer"].iter_rows(min_row=2, values_only=True))
          print("Treffer je Plattform:", Counter(z[3] for z in zeilen))
          for z in zeilen[:40]:
              print(f"{z[1]:3d} | {str(z[3])[:20]:20s} | {str(z[2])[:80]:80s} | {z[6]} | {z[9]}")
          PY
